name: Pull Request

on:
  # pull_request_target required for fork PRs to receive secrets.
  # Mitigated by permission-check job's Member Check pattern.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [master]

permissions:
  contents: read

jobs:
  permission-check:
    runs-on: forcedotcom-ubuntu  # forks: use ubuntu-latest (org-scoped runner)
    steps:
      - name: Check Write Permission
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d  # v2.4.0
        id: check_permissions
        with:
          route: GET /repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug Permission Response
        env:
          PERMISSION_DATA: ${{ steps.check_permissions.outputs.data }}
        run: |
          echo "Permission raw response: $PERMISSION_DATA"
      - name: Validate Write Permission
        env:
          PERMISSION_DATA: ${{ steps.check_permissions.outputs.data }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(echo "$PERMISSION_DATA" | jq -r '.permission // empty')
          echo "User $TRIGGERING_ACTOR has permission: $permission"
          if [[ "$permission" != "write" && "$permission" != "admin" ]]; then
            echo "User $TRIGGERING_ACTOR does not have sufficient permission (write or admin) to proceed. Someone from the team needs to rerun this workflow AFTER it has been deemed safe."
            exit 1
          fi

  ios-pr:
    permissions:
      contents: read
    needs: [permission-check]
    strategy:
      fail-fast: false
      matrix:
        app: [native_swift, hybrid_local, MobileSyncExplorerReactNative]
    uses: ./.github/workflows/ios-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      ios: "27"
      runner: xcode-27
      is_pr: true
    secrets:
      IOS_UI_TEST_CONFIG: ${{ secrets.IOS_UI_TEST_CONFIG }}

  android-pr:
    permissions:
      contents: read
    needs: [permission-check]
    strategy:
      fail-fast: false
      matrix:
        app: [native_kotlin, hybrid_local, MobileSyncExplorerReactNative]
    uses: ./.github/workflows/android-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      is_pr: true
    secrets:
      ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}

  ci-provenance:
    name: CI provenance
    if: always()
    needs: ["permission-check", "ios-pr", "android-pr"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record GitHub execution context
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTED_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          fields = {
              'repository': 'REPOSITORY', 'repository_id': 'REPOSITORY_ID',
              'run_id': 'RUN_ID', 'run_attempt': 'RUN_ATTEMPT', 'event': 'EVENT',
              'workflow_sha': 'WORKFLOW_SHA', 'sha': 'EXECUTED_SHA',
              'pr': 'PR_NUMBER', 'head_sha': 'HEAD_SHA',
              'head_repository_id': 'HEAD_REPOSITORY_ID',
              'base_sha': 'BASE_SHA', 'base_ref': 'BASE_REF',
          }
          value = {key: os.environ[env] for key, env in fields.items()}
          value['workflow_path'] = '.github/workflows/pr.yaml'
          with open('provenance.json', 'w') as output:
              json.dump(value, output, sort_keys=True)
          PYTHON
      - name: Upload provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
